site_name: Fundamentals Docs
site_url: https://yavor-mishev.github.io/fundamentals-docs/
repo_url: https://github.com/yavor-mishev/fundamentals-docs

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

# Empty or one-line pages: shown by `mkdocs serve`, left out of the published site.
# Remove a line here (and add the page to nav) once it has real content.
draft_docs: |
  cpp/arrays.md
  javascript/web-api.md
  web-engines/
  react/udemy/react-essentials/
  react/udemy/react-essentials-deep-dive/
  styling/css.md
  styling/less.md
  styling/sass/scss.md
  cs/blazor/blazor.md
  nodejs/restful-services.md
  next-js/nextjs-dashboard/

nav:
  - Home: index.md
  - Fundamentals:
      - Algorithms: algorithms/algorithms.md
      - Regex: regex/regex.md
      - HTTP: http/http.md
      - APIs: api/api.md
