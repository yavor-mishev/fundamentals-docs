site_name: Fundamentals Docs
site_url: https://yavor-mishev.github.io/fundamentals-docs/
repo_url: https://github.com/yavor-mishev/fundamentals-docs

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - redirects:
      redirect_maps:
        algorithms/algorithms.md: fundamentals/algorithms.md
        regex/regex.md: fundamentals/regex.md
        http/http.md: fundamentals/http.md
        api/api.md: fundamentals/apis.md
        asp-net-mvc/mvc.md: fundamentals/architecture-patterns/mvc.md
        mvvm/mvvm.md: fundamentals/architecture-patterns/mvvm.md
        cpp/00_cpp.md: languages/cpp/index.md
        cpp/01_variables.md: languages/cpp/variables.md
        cpp/02_pointers.md: languages/cpp/pointers.md
        cpp/03_references.md: languages/cpp/references.md
        cpp/04_classes.md: languages/cpp/classes.md
        cpp/05_static.md: languages/cpp/static.md
        cpp/06_constructors.md: languages/cpp/constructors.md
        cs/c-sharp.md: languages/csharp.md
        javascript/javascript.md: languages/javascript/index.md
        javascript/event-loop.md: languages/javascript/event-loop.md
        javascript/prototypical-inheritance.md: languages/javascript/prototypal-inheritance.md
        ts/ts.md: languages/typescript.md
        html/html.md: web/html.md
        styling/sass/sass.md: web/styling/sass.md
        react/00_js-refresher.md: web/react/js-refresher.md
        react/01_react-essentials.md: web/react/react-essentials.md
        react/udemy/getting-started.md: web/react/udemy/getting-started.md
        next-js/next-js.md: web/nextjs/index.md
        jquery/README.md: web/jquery/index.md
        jquery/plugins.md: web/jquery/plugins.md
        nodejs/nodejs.md: backend/nodejs/index.md
        nodejs/npm.md: backend/nodejs/npm.md
        nodejs/express.md: backend/nodejs/express.md
        projects/node-web-server/docs.md: backend/nodejs/node-web-server.md
        web-servers/web-server.md: backend/web-servers.md
        dotnet/dotnet.md: backend/dotnet/index.md
        dotnet/web/asp-net-core.md: backend/dotnet/asp-net-core.md
        dotnet/web/asp-net-mvc.md: backend/dotnet/asp-net-mvc.md
        dotnet/web/mvc-vs-core.md: backend/dotnet/mvc-vs-core.md
        sitefinity/onboarding.md: backend/dotnet/sitefinity.md
        pixi/pixijs.md: gamedev/pixi/index.md
        pixi/pixi-layers.md: gamedev/pixi/layers.md
        pixi/pixi-projection.md: gamedev/pixi/projection.md
        pixi/spine.md: gamedev/pixi/spine.md
        gsap/gsap.md: gamedev/gsap.md
        blender/blender.md: gamedev/blender.md
        git/README.md: tooling/git.md
        terminal-vs-shell/terminal-vs-shell.md: tooling/shell/index.md
        terminal-vs-shell/shell.md: tooling/shell/shell-basics.md
        terminal-vs-shell/shells-compared.md: tooling/shell/shells-compared.md
        terminal-vs-shell/customizing-your-shell.md: tooling/shell/customizing-your-shell.md
        terminal-vs-shell/oh-my-posh-prompt.md: tooling/shell/oh-my-posh-prompt.md
        docker/docker.md: tooling/docker.md
        linux/boot-process.md: tooling/linux/boot-process.md
        linux/systemd.md: tooling/linux/systemd.md
        lsp/lsp.md: tooling/lsp.md
        markdown/markdown-cheatsheet.md: tooling/markdown.md
        jest/jest.md: tooling/testing/jest.md
        selenium/selenium-webdriver.md: tooling/testing/selenium.md
        ai/prompting.md: other/ai-prompting.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

# Empty or one-line pages: shown by `mkdocs serve`, left out of the published site.
# Remove a line here (and add the page to nav) once it has real content.
draft_docs: |
  languages/cpp/arrays.md
  languages/javascript/web-api.md
  web/engines/
  web/react/udemy/essentials.md
  web/react/udemy/essentials-deep-dive.md
  web/styling/css.md
  web/styling/less.md
  web/styling/scss.md
  backend/dotnet/blazor.md
  backend/nodejs/restful-services.md
  web/nextjs/dashboard.md

